# Supabase project config. Set project_id after `supabase link`.
# Docs: https://supabase.com/docs/guides/cli/config
project_id = "re-charge"

[functions.project-intake]
verify_jwt = false        # public: the website posts here without a user token

[functions.assistant]
verify_jwt = false        # public: the AI assistant on the website (rate-limited in the function)

[functions.create-yoco-checkout]
verify_jwt = false        # public: called by the website after intake

[functions.yoco-webhook]
verify_jwt = false        # public: Yoco calls it; the signature is the auth

[functions.google-oauth-start]
verify_jwt = true         # authenticated user starts the Google connect

[functions.google-oauth-callback]
verify_jwt = false        # Google redirects here; state is signed

[functions.analytics-properties]
verify_jwt = true         # authenticated user lists/saves properties

[functions.analytics-sync]
verify_jwt = false        # scheduled + guarded by SYNC_SECRET

[functions.monthly-report]
verify_jwt = false        # pg_cron on the 1st (0018); one report per client per month; staff/secret for previews

# Refresh analytics nightly. After deploy, schedule analytics-sync with pg_cron
# + pg_net (see BACKEND.md), passing header x-sync-secret: <SYNC_SECRET>.
# monthly-report is scheduled by migration 0018 (no secret needed).

[functions.send-message]
verify_jwt = true         # admin panel sends email as a signed-in staff user

[functions.resend-webhook]
verify_jwt = false        # Resend calls it; the signature is the auth

[functions.publish-site]
verify_jwt = true         # admin panel publishes previews as a signed-in staff user

[functions.build-sync]
verify_jwt = true         # admin panel ↔ GitHub-based mockup builder (staff only)

[functions.quote]
verify_jwt = false        # public: the client opens the quote link; the token is the credential

[functions.site-monitor]
verify_jwt = false        # pg_cron calls it every 10 min; throttled, staff can force a check

[functions.finder]
verify_jwt = false        # pull is public+throttled (pg_cron); setup/config check staff in code

[functions.care-billing]
verify_jwt = false        # pg_cron daily (0019); skips clients already sent a link this period

[functions.offer]
verify_jwt = false        # public, read-only: the site banner reads the running offer and spots left

[functions.notify-push]
verify_jwt = true         # admin panel turns phone alerts on/off and sends a test (staff only)
