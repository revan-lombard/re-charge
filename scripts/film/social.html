<!doctype html><html><head><meta charset="utf-8">
<!-- Social clips: one example each (email / question / invoice), ~21 s, muted with
     on-screen words, ending on a held call-to-action. render(t) draws time t.
     URL hash: <episode>,<format>   e.g.  #email,feed   #invoice,story
     feed = 720×900 (4:5, rendered at 1.5× → 1080×1350), story = 720×1280 (9:16 → 1080×1920).
     Paced for reading: text types at ~32 characters a second and each step holds. -->
<link rel="stylesheet" href="fonts-local.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#4d8dff;--bright:#82b1ff;--ok:#3ddc97;--text:#e7ecf3;--muted:#96a2b4;--dim:#647089;--card:#111722;--border:#253047}
html,body{overflow:hidden;background:#07090e;color:var(--text);font-family:Inter,sans-serif}
#stage{position:relative;overflow:hidden;background:#07090e}
.feed #stage{width:720px;height:900px}.story #stage{width:720px;height:1280px}
#glow{position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(closest-side,rgba(77,141,255,.20),rgba(77,141,255,0));left:-90px;top:-260px}
#glow2{position:absolute;width:700px;height:700px;border-radius:50%;background:radial-gradient(closest-side,rgba(61,220,151,.10),rgba(61,220,151,0));right:-260px;bottom:-200px}

/* brand line, top-left */
#brand{position:absolute;left:48px;top:44px;display:flex;align-items:center;gap:12px;opacity:0}
.story #brand{top:236px}
#brand img{width:34px;height:auto}
#brand b{font:700 21px 'Space Grotesk';letter-spacing:.14em}
#brand b i{font-style:normal;color:var(--accent)}
#brand span{margin-left:10px;font:500 13px 'Space Grotesk';letter-spacing:.16em;color:var(--dim);border:1px solid var(--border);border-radius:99px;padding:5px 11px}

/* hook */
#hook{position:absolute;left:48px;right:48px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center}
#hook h1{font:700 66px/1.04 'Space Grotesk';letter-spacing:-.025em}
#hook h1 em{font-style:normal;color:var(--bright)}
#hook p{margin-top:26px;font:400 28px/1.35 Inter;color:var(--muted)}
.story #hook h1{font-size:72px}

/* the three steps */
#flow{position:absolute;left:48px;right:48px;top:122px}
.story #flow{top:330px}
.lab{font:600 15px 'Space Grotesk';letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-bottom:12px}
.box{border-radius:22px;border:1px solid var(--border);background:var(--card);padding:24px 26px}
#in .box p{font:400 27px/1.42 Inter}
#in .from{display:block;font:600 15px Inter;color:var(--muted);margin-bottom:8px}
#ai{display:flex;align-items:baseline;gap:16px;margin:20px 0 20px 26px;padding:18px 0 18px 24px;border-left:3px solid var(--accent)}
#ai .lab{margin:0;color:var(--bright);white-space:nowrap;flex:none}
#ai .t{font:500 25px/1.35 Inter}
#ai .dots{display:inline-flex;gap:6px;margin-left:4px}
#ai .dots i{width:8px;height:8px;border-radius:50%;background:var(--bright);display:block}
#out .box{border-color:rgba(61,220,151,.45);background:linear-gradient(180deg,rgba(61,220,151,.08),rgba(61,220,151,.03))}
#out .lab{color:var(--ok)}
#out .box p{font:500 27px/1.42 Inter}
#out .src{display:block;margin-top:10px;font:500 17px Inter;color:var(--muted)}
#out .check{margin-top:16px;font:700 21px Inter;color:var(--ok)}
#time{margin-top:30px;display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
#time s{font:600 54px 'Space Grotesk';color:var(--dim);text-decoration-thickness:4px}
#time b{font:700 64px 'Space Grotesk';color:var(--ok);letter-spacing:-.02em}
#time span{font:400 25px Inter;color:var(--muted)}
.story #time{margin-top:44px}

/* end card */
#end{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 56px;opacity:0;background:radial-gradient(600px 600px at 50% 45%,#0f1a33 0%,#07090e 70%)}
#end img{width:96px;margin-bottom:22px}
#end .wm{font:700 40px 'Space Grotesk';letter-spacing:.16em;margin-bottom:34px}
#end .wm i{font-style:normal;color:var(--accent)}
#end h2{font:700 50px/1.1 'Space Grotesk';letter-spacing:-.02em}
#end h2 em{font-style:normal;color:var(--ok)}
#end .cta{margin-top:40px;font:700 26px Inter;color:#fff;background:var(--accent);border-radius:99px;padding:20px 36px;box-shadow:0 14px 40px rgba(77,141,255,.35)}
#end .url{margin-top:22px;font:500 24px 'Space Grotesk';letter-spacing:.04em;color:var(--bright)}
.story #end{padding-bottom:120px}
</style></head>
<body><div id="stage">
  <div id="glow"></div><div id="glow2"></div>
  <div id="brand"><img src="../../assets/brand/mark.svg" alt=""><b>RE<i>-</i>CHARGE</b><span>EXAMPLE</span></div>
  <div id="hook"><h1></h1><p></p></div>
  <div id="flow">
    <div id="in"><div class="lab">1 · Comes in</div><div class="box"><span class="from"></span><p></p></div></div>
    <div id="ai"><span class="lab">2 · AI</span><span class="t"></span><span class="dots"><i></i><i></i><i></i></span></div>
    <div id="out"><div class="lab">3 · Ready for you</div><div class="box"><p></p><span class="src"></span><div class="check"></div></div></div>
    <div id="time"><s></s><b></b><span></span></div>
  </div>
  <div id="end"><img src="../../assets/brand/mark.svg" alt=""><div class="wm">RE<i>-</i>CHARGE</div><h2>AI that does the admin.<br><em>A person still checks it.</em></h2><div class="cta">Book a free 30-minute call</div><div class="url">re-charge.co.za</div></div>
</div>
<script>
const EP = {
  email: { hook: 'Answering the same <em>emails</em> all day?', sub: 'Here’s what AI does with one.',
    from: 'Customer email', msg: '“Hi, how much to service 3 aircons at our office? Can you come next week?”',
    ai: 'reads it and writes the reply', out: '“Hi Sarah, servicing 3 units is R2,850. We can come Tuesday or Thursday. Which suits you?”', src: '',
    check: '✓ You check it and press send.', before: '15 min', after: '2 min', per: 'per email' },
  question: { hook: 'Your team asking the <em>same questions</em>?', sub: 'Here’s what AI does with one.',
    from: 'Question from your team', msg: '“Can I give this client 60 days to pay?”',
    ai: 'finds the answer in your documents', out: '“Only if the finance manager agrees.”', src: 'From: Credit policy, page 3',
    check: '✓ The answer, and where it came from.', before: '10 min', after: 'under 1 min', per: 'per question' },
  invoice: { hook: 'Still typing <em>invoices</em> in by hand?', sub: 'Here’s what AI does with one.',
    from: 'Supplier invoice (PDF)', msg: 'Delta Packaging · 14 lines · R48,276.50',
    ai: 'types it into your accounts and checks the prices', out: 'Invoice captured. 12 boxes billed, but only 10 arrived: flagged.', src: '',
    check: '✓ You check that one line before paying.', before: '6 min', after: '1 min', per: 'per invoice' },
};
const [epKey, fmt] = (location.hash.slice(1) || 'email,feed').split(',');
document.body.className = fmt === 'story' ? 'story' : 'feed';
const E = EP[epKey] || EP.email;
const $ = (s) => document.querySelector(s);
$('#hook h1').innerHTML = E.hook; $('#hook p').textContent = E.sub;
$('#in .from').textContent = E.from; $('#ai .t').textContent = E.ai; $('#out .src').textContent = E.src;
$('#time s').textContent = E.before; $('#time b').textContent = E.after; $('#time span').textContent = E.per;

const cl = (x) => Math.max(0, Math.min(1, x));
const seg = (t, a, b) => cl((t - a) / (b - a));
const ease = (x) => 1 - Math.pow(1 - x, 3);
const show = (el, p, dy = 18) => { el.style.opacity = p; el.style.transform = `translateY(${(1 - ease(p)) * dy}px)`; };
// Typed text keeps the rest of the sentence as invisible space, so boxes never jump.
const esc = (x) => x.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const typed = (text, t, t0, cps) => { const n = Math.max(0, Math.floor((t - t0) * cps)); return esc(text.slice(0, n)) + '<span style="visibility:hidden">' + esc(text.slice(n)) + '</span>'; };

// Timeline (seconds). Total 21.
const T = { hookIn: 0.2, hookOut: 3.6, inAt: 4.0, msgAt: 4.5, aiAt: 7.6, outAt: 10.0, replyAt: 10.4, checkAt: 13.6, timeAt: 14.8, endAt: 17.2 };
window.DURATION = 21;
window.render = (t) => {
  // background drift
  $('#glow').style.transform = `translate(${Math.sin(t / 3.2) * 40}px, ${Math.cos(t / 4) * 30}px)`;
  $('#glow2').style.transform = `translate(${Math.cos(t / 3.6) * 30}px, ${Math.sin(t / 2.8) * 26}px)`;
  // hook: in, hold, out
  const hk = $('#hook');
  const hin = seg(t, T.hookIn, T.hookIn + 0.7), hout = seg(t, T.hookOut, T.hookOut + 0.4);
  hk.style.opacity = hin * (1 - hout); hk.style.transform = `translateY(${(1 - ease(hin)) * 26 - hout * 30}px)`;
  $('#hook p').style.opacity = seg(t, 1.3, 1.9);
  // brand line
  $('#brand').style.opacity = seg(t, T.inAt - 0.2, T.inAt + 0.4) * (1 - seg(t, T.endAt, T.endAt + 0.4));
  // 1 · comes in
  show($('#in'), seg(t, T.inAt, T.inAt + 0.5));
  $('#in .box p').innerHTML = typed(E.msg, t, T.msgAt, 32);
  // 2 · AI
  const aip = seg(t, T.aiAt, T.aiAt + 0.5); show($('#ai'), aip, 12);
  const working = t >= T.aiAt && t < T.outAt;
  [...document.querySelectorAll('#ai .dots i')].forEach((d, i) => { d.style.opacity = working ? 0.25 + 0.75 * Math.max(0, Math.sin((t * 6) - i * 0.9)) : 0; });
  // 3 · ready for you
  show($('#out'), seg(t, T.outAt, T.outAt + 0.5));
  $('#out .box p').innerHTML = typed(E.out, t, T.replyAt, 34);
  $('#out .src').style.opacity = E.src ? seg(t, T.replyAt + E.out.length / 34, T.replyAt + E.out.length / 34 + 0.4) : 0;
  $('#out .check').textContent = t >= T.checkAt ? E.check : ''; $('#out .check').style.opacity = seg(t, T.checkAt, T.checkAt + 0.4);
  // time saved
  show($('#time'), seg(t, T.timeAt, T.timeAt + 0.5), 14);
  // flow fades for the end card
  $('#flow').style.opacity = 1 - seg(t, T.endAt, T.endAt + 0.4);
  const ep = seg(t, T.endAt, T.endAt + 0.6); $('#end').style.opacity = ep;
  $('#end h2').style.transform = `translateY(${(1 - ease(seg(t, T.endAt + 0.2, T.endAt + 0.9))) * 20}px)`;
  $('#end .cta').style.opacity = seg(t, T.endAt + 0.8, T.endAt + 1.3);
  $('#end .url').style.opacity = seg(t, T.endAt + 1.1, T.endAt + 1.6);
};
render(0);
</script></body></html>
