<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07090e">
<title>Re-Charge</title>
<meta name="description" content="AI for the work that drains your team.">
<link rel="icon" href="assets/favicon-32.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<!-- The page behind the QR code (business card back, phone cover screen; scripts/card/).
     Top: the 3D logo floating and spinning on a plain background (three.js, no camera).
     Below: book a call, WhatsApp, save the contact (assets/re-charge.vcf). -->
<style>
:root { --accent: #4d8dff; --bright: #82b1ff; --ok: #3ddc97; --text: #e7ecf3; --muted: #96a2b4; --wa: #25d366; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #07090e; color: var(--text); font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
body { display: flex; flex-direction: column; min-height: 100dvh; overflow-x: hidden; }
.stage { position: relative; isolation: isolate; flex: 1 1 auto; min-height: 50dvh; overflow: hidden;
  background: radial-gradient(70% 60% at 50% 40%, #12224a 0%, #07090e 70%); }
#float { position: absolute; inset: 0; }
#float canvas { display: block; }
.stage::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 22%; pointer-events: none;
  background: linear-gradient(to bottom, rgba(7,9,14,0), #07090e); }
.panel { position: relative; z-index: 3; padding: 4px 20px max(22px, env(safe-area-inset-bottom)); display: grid; gap: 12px; max-width: 460px; width: 100%; margin: 0 auto; }
.brand { text-align: center; margin-bottom: 4px; }
.brand b { display: block; font: 700 15px/1 "Space Grotesk", Inter, sans-serif; letter-spacing: .18em; }
.brand b i { font-style: normal; color: var(--accent); }
.brand p { margin-top: 8px; font-size: 15px; color: var(--muted); }
.brand p em { font-style: normal; color: var(--ok); }
.btn { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; border-radius: 16px;
  font: 700 17px/1 Inter, system-ui, sans-serif; text-decoration: none; transition: transform .15s; }
.btn:active { transform: scale(.98); }
.btn svg { width: 22px; height: 22px; flex: none; }
.btn--book { background: var(--accent); color: #fff; box-shadow: 0 12px 30px rgba(77,141,255,.35); }
.btn--wa { background: var(--wa); color: #06210f; }
.btn--save { background: transparent; color: var(--text); border: 1px solid rgba(255,255,255,.18); }
.foot { text-align: center; font-size: 13px; color: var(--muted); }
.foot a { color: var(--bright); text-decoration: none; }
@media (min-width: 700px) { .stage { min-height: 56dvh; } }

</style>
</head>
<body>
  <section class="stage" aria-label="Your card, in 3D">
    <div id="float"></div>
  </section>

  <main class="panel">
    <div class="brand"><b>RE<i>-</i>CHARGE</b><p>AI for the work that <em>drains your team.</em></p></div>
    <a class="btn btn--book" id="book" href="https://calendar.app.google/58FYamh1ahXB4khM9" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      Book a free 30-minute call</a>
    <a class="btn btn--wa" id="wa" href="https://wa.me/27722375833?text=Hi%20Re-Charge%2C%20I%20scanned%20your%20card." target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>
      Message me on WhatsApp</a>
    <a class="btn btn--save" id="save" href="assets/re-charge.vcf" download="Re-Charge.vcf">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M19 8v6M16 11h6"/></svg>
      Save contact</a>
    <p class="foot"><a href="./" id="site">re-charge.co.za</a></p>
  </main>

  <script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.149.0/examples/jsm/"
  } }
  </script>
  <script type="module">
  import * as THREE from 'three';
  import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';
  import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- the logo, in 3D: the two shapes of the mark, extruded; the leg sits a little proud of the top ----
  const MARK = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 505 480">
    <path id="top" d="M24 0H405A100 100 0 0 1 505 100V255A120 120 0 0 1 385 375H375L245 245H338A42 42 0 0 0 380 203V157A42 42 0 0 0 338 115H147L14 12Q8 0 24 0Z"/>
    <path id="leg" d="M5 464V335A100 100 0 0 1 105 235H200A110 110 0 0 1 277.8 267.2L482 471.4Q489 478 479 478H329L213 366Q189 343 166 343H162A37 37 0 0 0 125 380V466A12 12 0 0 1 113 478H17A12 12 0 0 1 5 466Z"/></svg>`;
  function makeLogo() {
    const data = new SVGLoader().parse(MARK);
    const mats = {
      top: new THREE.MeshPhysicalMaterial({ color: 0xf4f7fb, metalness: 0.85, roughness: 0.22, clearcoat: 1, clearcoatRoughness: 0.15 }),
      leg: new THREE.MeshPhysicalMaterial({ color: 0x8a95a8, metalness: 0.9, roughness: 0.3, clearcoat: 0.6 }),
    };
    const g = new THREE.Group();
    data.paths.forEach((p) => {
      const id = p.userData.node.id;
      const geo = new THREE.ExtrudeGeometry(SVGLoader.createShapes(p), { depth: 46, bevelEnabled: true, bevelThickness: 7, bevelSize: 5, bevelSegments: 4, curveSegments: 28 });
      const m = new THREE.Mesh(geo, mats[id] || mats.top);
      if (id === 'leg') m.position.z = 14;
      g.add(m);
    });
    g.scale.set(1, -1, 1);                         // SVG y runs down
    const box = new THREE.Box3().setFromObject(g), c = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3());
    g.position.set(-c.x, -c.y, -c.z);
    const unit = new THREE.Group(); unit.add(g);
    unit.scale.setScalar(1 / Math.max(size.x, size.y));   // 1 unit wide
    const outer = new THREE.Group(); outer.add(unit);       // animate() scales and moves this one
    return outer;
  }
  function makeRing() {
    const ring = new THREE.Mesh(new THREE.RingGeometry(0.42, 0.5, 96),
      new THREE.MeshBasicMaterial({ color: 0x4d8dff, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, depthWrite: false }));
    return ring;
  }
  function lights(scene, renderer) {
    const pm = new THREE.PMREMGenerator(renderer);
    scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
    const key = new THREE.DirectionalLight(0xffffff, 1.4); key.position.set(1, 2, 3); scene.add(key);
    const rim = new THREE.DirectionalLight(0x82b1ff, 1.2); rim.position.set(-2, -1, -2); scene.add(rim);
    scene.add(new THREE.AmbientLight(0xffffff, 0.35));
  }
  // float and spin; `appear` 0→1 pops it in when the card is found
  function animate(obj, ring, t, appear) {
    const e = 1 - Math.pow(1 - appear, 3), back = appear < 1 ? 1 + 0.25 * Math.sin(appear * Math.PI) : 1;
    obj.scale.setScalar(e * back * (obj.userData.size || 1));
    obj.position.z = (obj.userData.lift || 0) + (RM ? 0 : Math.sin(t * 1.7) * 0.04);
    obj.rotation.y = RM ? 0.5 : t * 1.25;
    if (ring) { const p = 0.5 + 0.5 * Math.sin(t * 2.2); ring.material.opacity = 0.25 + 0.4 * p * e; ring.scale.setScalar(0.9 + 0.12 * p); }
  }

  // ---- the logo, floating and spinning ----
  const floatEl = document.getElementById('float');
  const fr = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  fr.setPixelRatio(Math.min(devicePixelRatio, 2)); fr.outputEncoding = THREE.sRGBEncoding; fr.toneMapping = THREE.ACESFilmicToneMapping;
  floatEl.appendChild(fr.domElement);
  const fs = new THREE.Scene(), fc = new THREE.PerspectiveCamera(35, 1, 0.1, 50); fc.position.set(0, 0, 3.4);
  lights(fs, fr);
  const fl = makeLogo(); fl.userData.size = 1; fs.add(fl);
  const fring = makeRing(); fring.rotation.x = -Math.PI / 2.4; fring.position.y = -0.72; fs.add(fring);
  const sizeFloat = () => { const w = floatEl.clientWidth, h = floatEl.clientHeight; fr.setSize(w, h); fc.aspect = w / h; fc.position.z = w / h < 0.8 ? 4.2 : 3.4; fc.updateProjectionMatrix(); };
  sizeFloat(); addEventListener('resize', sizeFloat);
  const t0 = performance.now();
  fr.setAnimationLoop(() => {
    const t = (performance.now() - t0) / 1000;
    animate(fl, fring, t, Math.min(1, t / 0.8)); fl.position.y = 0.08;
    fr.render(fs, fc);
  });
  window.__cardScene = { ready: true };          // used by the page test

  // ---- scans and taps, counted without cookies (GoatCounter) ----
  function count(name) { try { window.goatcounter?.count?.({ path: name, title: name, event: true }); } catch (e) { /* ignore */ } }
  addEventListener('load', () => setTimeout(() => count(new URLSearchParams(location.search).get('src') === 'card' ? 'card-scan' : 'card-visit'), 800));
  document.getElementById('book').addEventListener('click', () => count('card-book'));
  document.getElementById('wa').addEventListener('click', () => count('card-whatsapp'));
  document.getElementById('save').addEventListener('click', () => count('card-save-contact'));
  </script>
  <script data-goatcounter="https://revan-lombard.goatcounter.com/count" data-goatcounter-settings='{"no_onload": true}' async src="//gc.zgo.at/count.js"></script>
</body>
</html>
