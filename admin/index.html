<body class="adm">
  <a class="skip-link" href="#view">Skip to content</a>

  <header class="adm-top">

      <img src="/assets/logo-mark.png" alt="R" width="505" height="480" />E<span class="logo-hyphen">-</span>CHARGE

    <form class="adm-search" id="searchForm" role="search" hidden>

      <input type="search" id="searchInput" placeholder="Search leads, refs, emails…" aria-label="Search" autocomplete="off" />
      <kbd aria-hidden="true">⌘K</kbd>
    </form>
    <div class="adm-top__right">
      <span id="whoami" class="small muted" hidden></span>
      <button id="signOut" class="btn btn--ghost btn--small" hidden>Sign out</button>
    </div>
  </header>

  <nav class="adm-nav" id="adminNav" aria-label="Admin sections" hidden>
    <a href="#/" data-nav="overview"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12 12 4l9 8"/><path d="M5 10v10h14V10"/></svg><span>Overview</span></a>
    <a href="#/pipeline" data-nav="pipeline"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="10" rx="1"/><rect x="17" y="4" width="4" height="13" rx="1"/></svg><span>Pipeline</span></a>

    <a href="#/clients" data-nav="clients"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 14.5a5 5 0 0 1 6 5"/></svg><span>Clients</span></a>
  </nav>

  <main id="view" class="adm-main" tabindex="-1">
    <p id="bootMsg" class="muted adm-boot">Loading…</p>
  </main>

  <div class="adm-toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="/config.js"></script>
  <script type="module" src="/admin/admin.js"></script>
